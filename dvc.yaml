stages:
  preprocess:
    cmd: python -m behavior_engineering.pipelines.preprocess
    deps:
      - data/online_shoppers_intention.csv
      - src/behavior_engineering/pipelines/preprocess.py
      - src/behavior_engineering/data/loader.py
      - src/behavior_engineering/config.py
    params:
      - configs/params.yaml:
          - seed
          - data
    outs:
      - data/processed

  train:
    cmd: python -m behavior_engineering.pipelines.train
    deps:
      - data/processed
      - src/behavior_engineering/pipelines/train.py
      - src/behavior_engineering/features
      - src/behavior_engineering/models
      - src/behavior_engineering/config.py
    params:
      - configs/params.yaml:
          - seed
          - features
          - model
          - train
    outs:
      - models/model.joblib
    metrics:
      - metrics.json:
          cache: false
