[project]
name = "behavior-engineering"
version = "0.1.0"
description = "Pipeline de ML para prever a intenção de compra em sessões de e-commerce (Online Shoppers Purchasing Intention)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.60",
    "fastapi>=0.142.1",
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
notebook = [
    "ipykernel",
    "jupyter",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_engineering"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
